<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 660" width="660" height="660">
  <defs>
    <style>
      .box-line { stroke: #073642; stroke-width: 2.2; fill: none; }
      .axis-line { stroke: #073642; stroke-width: 1.6; fill: none; }
      .corner-circle { stroke: #073642; stroke-width: 2.4; fill: none; }
      .center-circle { stroke: #b58900; stroke-width: 2.8; fill: rgba(181, 137, 0, 0.08); }
      .diag-line { stroke: #b58900; stroke-width: 2.5; stroke-linecap: round; }
      .diag-dot { fill: #b58900; }
      .corner-dot { fill: #073642; }
      .label { font-family: 'Times New Roman', Georgia, serif; font-size: 22px; fill: #073642; }
      .math-label { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 22px; fill: #073642; }
      .bracket { stroke: #073642; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fdf6e3" />

  <!-- 4x4 Bounding Square: [85, 525] x [105, 545] (440x440 px, center at (305, 325)) -->
  <rect x="85" y="105" width="440" height="440" class="box-line" />

  <!-- Center axes dividing quadrants -->
  <line x1="85" y1="325" x2="525" y2="325" class="axis-line" />
  <line x1="305" y1="105" x2="305" y2="545" class="axis-line" />

  <!-- Four corner circles of radius 110 px -->
  <!-- Top-Left: center (195, 215) -->
  <circle cx="195" cy="215" r="110" class="corner-circle" />
  <!-- Top-Right: center (415, 215) -->
  <circle cx="415" cy="215" r="110" class="corner-circle" />
  <!-- Bottom-Left: center (195, 435) -->
  <circle cx="195" cy="435" r="110" class="corner-circle" />
  <!-- Bottom-Right: center (415, 435) -->
  <circle cx="415" cy="435" r="110" class="corner-circle" />

  <!-- Central inner circle: center (305, 325), radius (sqrt(2)-1)*110 = 45.56 px -->
  <circle cx="305" cy="325" r="45.56" class="center-circle" />

  <!-- Diagonal line segment connecting (0,0) to (1,1) -->
  <line x1="305" y1="325" x2="415" y2="215" class="diag-line" />
  <!-- Dot at (0,0) -->
  <circle cx="305" cy="325" r="5" class="diag-dot" />
  <!-- Dot at (1,1) -->
  <circle cx="415" cy="215" r="6" class="diag-dot" />

  <!-- Four corner black dots -->
  <circle cx="85" cy="105" r="6" class="corner-dot" />
  <circle cx="525" cy="105" r="6" class="corner-dot" />
  <circle cx="85" cy="545" r="6" class="corner-dot" />
  <circle cx="525" cy="545" r="6" class="corner-dot" />

  <!-- Corner Coordinates Labels -->
  <text x="20" y="112" class="math-label">(-2,2)</text>
  <text x="535" y="112" class="math-label">(2,2)</text>
  <text x="12" y="552" class="math-label">(-2,-2)</text>
  <text x="535" y="552" class="math-label">(2,-2)</text>

  <!-- Label (1,1) at center of top-right sphere -->
  <text x="425" y="195" class="math-label">(1,1)</text>

  <!-- Top dimension bracket (width = 4) -->
  <path d="M 85,85 L 85,70 L 525,70 L 525,85" class="bracket" />
  <text x="300" y="55" class="label" text-anchor="middle">4</text>

  <!-- Right dimension bracket (height = 4) -->
  <path d="M 545,105 L 560,105 L 560,545 L 545,545" class="bracket" />
  <text x="585" y="332" class="label">4</text>
</svg>