<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <marker id="angle-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#073642" />
    </marker>
  </defs>
  <style>
    .triangle-edge { stroke: #073642; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arc { stroke: #073642; stroke-width: 2.5; fill: none; }
    .label { font-family: 'Times New Roman', Georgia, serif; font-size: 28px; font-style: italic; fill: #073642; text-anchor: middle; }
    .vertex { font-family: 'Times New Roman', Georgia, serif; font-size: 26px; font-style: italic; fill: #073642; }
  </style>

  <!-- Triangle vertices:
       Origin O: (200, 480)
       Y: (80, 50)
       X: (640, 180)
  -->
  <polygon points="200,480 80,50 640,180" class="triangle-edge" />

  <!-- Angle arc at (200, 480) -->
  <!-- Vector to Y: dx = -120, dy = -430 -> angle ~ 254 deg (from +x) -->
  <!-- Vector to X: dx = 440, dy = -300 -> angle ~ 325 deg (from +x) -->
  <path d="M 270,432 A 90 90 0 0 0 180,400" class="arc" marker-end="url(#angle-arrow)" />

  <!-- Label theta -->
  <text x="235" y="390" class="label">&#952;</text>

  <!-- Side labels -->
  <text x="110" y="270" class="label">Y</text>
  <text x="460" y="355" class="label">X</text>
  <text x="340" y="95" class="label">C</text>

  <!-- Vertex labels -->
  <text x="60" y="45" class="vertex">y</text>
  <text x="650" y="185" class="vertex">x</text>
</svg>
